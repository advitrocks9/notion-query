name = "notion-query-mcp"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NotionQueryMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionQueryMCP"]

# Secrets set via CLI:
# npx wrangler secret put NOTION_API_KEY
# npx wrangler secret put MCP_AUTH_TOKEN

[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60
